openapi: 3.1.0
info:
  title: API Reference subpackage_billing subpackage_orders API
  version: 1.0.0
servers:
- url: https://api.shipbob.com
- url: https://sandbox-api.shipbob.com
tags:
- name: subpackage_orders
paths:
  /2026-01/order:
    post:
      operationId: create-order
      summary: Create Order
      description: Creates a new order in ShipBob’s system that will be queued for fulfillment. Orders can be created using either product reference IDs (SKUs) or ShipBob product IDs, with reference IDs being the recommended approach.
      tags:
      - subpackage_orders
      parameters:
      - name: Authorization
        in: header
        description: Authentication using Personal Access Token (PAT) token or OAuth2
        required: true
        schema:
          type: string
      - name: shipbob_channel_id
        in: header
        description: Retrieve your channel ID from the [GET /channel](/api/channels/get-channels) endpoint. Use the channel ID that has write scopes.
        required: true
        schema:
          type: string
          format: int32
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders.OrderViewModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders.Post.Api.Order.Bad.Request.Object'
        '401':
          description: No access right at this time
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: No access
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders.Post.Api.Order.Unprocessable.Entity.Object'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Orders.CreateOrderModel'
    get:
      operationId: get-orders
      summary: Get Orders
      description: Retrieves a paginated list of orders from your ShipBob account with optional filters. All filter parameters use AND logic, meaning orders must match all provided criteria to be returned.
      tags:
      - subpackage_orders
      parameters:
      - name: Page
        in: query
        description: Page of orders to get
        required: false
        schema:
          type: integer
      - name: Limit
        in: query
        description: Amount of orders per page to request
        required: false
        schema:
          type: integer
      - name: IDs
        in: query
        description: order ids to filter by, comma separated <br /><strong>Example:</strong> ?IDs=1,2
        required: false
        schema:
          type: string
      - name: ReferenceIds
        in: query
        description: Reference ids to filter by, comma separated <br /><strong>Example:</strong> ?ReferenceIds=Ref1,Ref2
        required: false
        schema:
          type: string
      - name: StartDate
        in: query
        description: Start date to filter orders inserted later than
        required: false
        schema:
          type: string
          format: date-time
      - name: EndDate
        in: query
        description: End date to filter orders inserted earlier than
        required: false
        schema:
          type: string
          format: date-time
      - name: SortOrder
        in: query
        description: Order to sort results in
        required: false
        schema:
          type: string
      - name: HasTracking
        in: query
        description: Has any portion of this order been assigned a tracking number
        required: false
        schema:
          type: boolean
      - name: LastUpdateStartDate
        in: query
        description: Start date to filter orders updated later than
        required: false
        schema:
          type: string
          format: date-time
      - name: LastUpdateEndDate
        in: query
        description: End date to filter orders updated later than
        required: false
        schema:
          type: string
          format: date-time
      - name: IsTrackingUploaded
        in: query
        description: Filter orders that their tracking information was fully uploaded
        required: false
        schema:
          type: boolean
      - name: LastTrackingUpdateStartDate
        in: query
        description: Start date to filter orders with tracking updates later than the supplied date. Will only return orders that have tracking information
        required: false
        schema:
          type: string
          format: date-time
      - name: LastTrackingUpdateEndDate
        in: query
        description: End date to filter orders updated later than the supplied date. Will only return orders that have tracking information
        required: false
        schema:
          type: string
          format: date-time
      - name: Authorization
        in: header
        description: Authentication using Personal Access Token (PAT) token or OAuth2
        required: true
        schema:
          type: string
      - name: shipbob_channel_id
        in: header
        description: Retrieve your channel ID from the [GET /channel](/api/channels/get-channels) endpoint. Use the channel ID that has write scopes.
        required: false
        schema:
          type: string
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders.OrderViewModelArray'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders.Get.Api.Order.Bad.Request.Object'
        '401':
          description: No access right at this time
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: No access
          content:
            application/json:
              schema:
                description: Any type
